name: Build

on:
  push:
    branches: [ master, dev/slayer-helper-lab, dev/companion-suite, dev/clue-scroll-hub, test/monsters-hub-shaman, test/combat-achievements-hub ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build
        run: ./gradlew clean build shadowJar

      - name: Package test source
        run: git archive HEAD --format=zip --output=build/OneMan-Sync-Legendary-TEST9.zip

      - name: Upload development build
        uses: actions/upload-artifact@v4
        with:
          name: oneman-legendary-alarms-test9
          path: |
            build/libs/*-all.jar
            build/OneMan-Sync-Legendary-TEST9.zip
            build/reports/tests/test/
